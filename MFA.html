<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>MFA Safety Training</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topbar">

        <div class="website-name">
            MFA SAFETY TRAINING
        </div>
        <div class="text-size">
            <span>Text size</span>

            <button
                type="button"
                data-text-scale="1"
                aria-label="Normal text">
                A
            </button>

            <button
                type="button"
                data-text-scale="1.25"
                aria-label="Large text">
                A
            </button>

            <button
                type="button"
                data-text-scale="1.5"
                aria-label="Extra large text">
                A
            </button>
        </div>

    </header>

    <main class="landing-page">

        <h1>Learn how MFA protects you</h1>

        <p class="landing-introduction">
            Choose a simulation to begin.
        </p>

        <div class="simulation-cards">

            <section class="simulation-card">

                <div class="card-icon" aria-hidden="true">
                    🛡
                </div>

                <h2>Attack Simulator</h2>

                <p>
                    See how MFA stops an attacker who already has
                    the password.
                </p>

                <a href="attack-info.html"
                   class="start-button">
                    Start simulation
                </a>

            </section>

            <section class="simulation-card">

                <div class="card-icon" aria-hidden="true">
                    📱
                </div>

                <h2>Authentication Request Simulator</h2>

                <p>
                    Practise responding to unexpected login requests.
                </p>

                <a href="mfa-info.html"
                   class="start-button">
                    Start simulation
                </a>
            </section>
        </div>
    </main>
    <script src="accessibility.js"></script>
</body>
</html>
