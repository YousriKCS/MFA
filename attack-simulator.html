<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Attack Simulator</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="mfa-picker">
      <button type="button" data-mfa="text">Code by text</button>
      <button type="button" data-mfa="app">Code in an app</button>
      <button type="button" data-mfa="popup">Code by popup</button>
    </div>

    <div class="stage">
      <div class="device-frame--laptop">
        <div class="laptop">
          <div class="content">
            <div class="browser">
              <div class="browser-bar">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <div class="url-bar">jubank.example/login</div>
              </div>

              <div class="browser-page">
                <div class="bank-header">JU Bank</div>

                <form class="login-card" id="login-form">
                  <h1>Sign in to online banking</h1>

                  <label for="email">Email</label>
                  <input type="email" id="email" value="" autocomplete="off">

                  <label for="password">Password</label>
                  <input type="password" id="password" value="" autocomplete="off">

                  <button type="submit">Sign in</button>
                  <p class="fine-print">Forgot your password?</p>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="device-frame--phone">
        <div class="smartphone">
          <div class="content">
            <p>Victim</p>
          </div>
        </div>
      </div>
    </div>

    <script src="index.js"></script>
  </body>
</html>
